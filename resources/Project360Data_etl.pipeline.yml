# The main pipeline for Project360Data

resources:
  pipelines:
    Project360Data_etl:
      name: Project360Data_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/Project360Data_etl"

      libraries:
        - glob:
            include: ../src/Project360Data_etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
